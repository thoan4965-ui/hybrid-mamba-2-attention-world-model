<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1060" width="1500" height="1060"
     font-family="Times New Roman, Times, serif">
<defs>
  <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
  </marker>
</defs>

<!-- ======== TẦNG 1: NHẬN DIỆN (y=40, h=100) ======== -->
<rect x="450" y="40" width="600" height="100" rx="14" fill="#fffbeb" stroke="#ea580c" stroke-width="3"/>
<text x="750" y="84" text-anchor="middle" font-size="26" fill="#1c2431">Nhận diện rác (MobileNetV2)</text>
<text x="750" y="118" text-anchor="middle" font-size="21" fill="#333">(vị trí + kích thước rác — cố định)</text>

<!-- ======== TẦNG 2: CĂN CHỈNH (y=230, h=110) ======== -->
<rect x="450" y="230" width="600" height="110" rx="14" fill="#fffbeb" stroke="#ea580c" stroke-width="3"/>
<text x="750" y="278" text-anchor="middle" font-size="26" fill="#1c2431">Căn chỉnh điểm kẹp (homing)</text>
<text x="750" y="312" text-anchor="middle" font-size="21" fill="#333">(so với vị trí kẹp chuẩn → sai số e)</text>

<!-- ======== TẦNG 3: BỘ NÃO (y=440, h=130) ======== -->
<rect x="80"   y="440" width="340" height="130" rx="14" fill="#f5f5f5" stroke="#555" stroke-width="3"/>
<text x="250"  y="494" text-anchor="middle" font-size="26" fill="#1c2431">Điều khiển cơ bản</text>
<text x="250"  y="530" text-anchor="middle" font-size="21" fill="#333">(toán đơn giản, đúng — cứng nhắc)</text>

<rect x="460"  y="440" width="340" height="130" rx="14" fill="#fffbeb" stroke="#ea580c" stroke-width="3"/>
<text x="630"  y="494" text-anchor="middle" font-size="26" fill="#1c2431">Phản xạ (CfC-habit)</text>
<text x="630"  y="530" text-anchor="middle" font-size="21" fill="#333">(học từ người điều khiển: bù sai số)</text>

<rect x="840"  y="440" width="340" height="130" rx="14" fill="#fffbeb" stroke="#ea580c" stroke-width="3"/>
<text x="1010" y="494" text-anchor="middle" font-size="26" fill="#1c2431">Dự đoán bước sau (CfC)</text>
<text x="1010" y="530" text-anchor="middle" font-size="21" fill="#333">(thử lệnh trước khi gửi)</text>

<rect x="1220" y="440" width="250" height="130" rx="14" fill="#f5f5f5" stroke="#555" stroke-width="3"/>
<text x="1345" y="494" text-anchor="middle" font-size="26" fill="#1c2431">Mục tiêu thành công</text>
<text x="1345" y="530" text-anchor="middle" font-size="21" fill="#333">(tâm các lần thành</text>
<text x="1345" y="554" text-anchor="middle" font-size="21" fill="#333">công — cố định)</text>

<!-- mũi: nhận diện → căn chỉnh ; căn chỉnh → 3 bộ não (elbow 90°) -->
<line x1="750" y1="140" x2="750" y2="225" stroke="#ea580c" stroke-width="3.5" marker-end="url(#m)"/>
<line x1="250" y1="340" x2="250" y2="390" stroke="#ea580c" stroke-width="3.5"/>
<line x1="250" y1="390" x2="1010" y2="390" stroke="#ea580c" stroke-width="3.5"/>
<line x1="250" y1="390" x2="250" y2="435" stroke="#ea580c" stroke-width="3.5" marker-end="url(#m)"/>
<line x1="630" y1="390" x2="630" y2="435" stroke="#ea580c" stroke-width="3.5" marker-end="url(#m)"/>
<line x1="1010" y1="390" x2="1010" y2="435" stroke="#ea580c" stroke-width="3.5" marker-end="url(#m)"/>

<!-- ======== TẦNG 4: TRỘN + CỔNG (y=650, h=110) ======== -->
<rect x="80"   y="650" width="660" height="110" rx="14" fill="#ffffff" stroke="#ea580c" stroke-width="3"/>
<text x="410"  y="692" text-anchor="middle" font-size="26" fill="#1c2431">Trộn lệnh</text>
<text x="410"  y="726" text-anchor="middle" font-size="21" fill="#333">(α·phản xạ + (1−α)·điều khiển cơ bản)</text>

<rect x="780"  y="650" width="340" height="110" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="950"  y="692" text-anchor="middle" font-size="26" fill="#1c2431">Cổng nhận biết lạ (OOD)</text>
<text x="950"  y="726" text-anchor="middle" font-size="21" fill="#333">(càng lệch Mục tiêu → α càng nhỏ)</text>

<!-- mũi: não → trộn (thẳng) -->
<line x1="250" y1="570" x2="250" y2="645" stroke="#ea580c" stroke-width="3.5" marker-end="url(#m)"/>
<line x1="630" y1="570" x2="630" y2="645" stroke="#ea580c" stroke-width="3.5" marker-end="url(#m)"/>
<!-- α: cổng → trộn (ngang ngắn) -->
<line x1="778" y1="705" x2="742" y2="705" stroke="#dc2626" stroke-width="3.5" marker-end="url(#m)"/>
<!-- dự đoán → cổng (elbow) ; mục tiêu → cổng (elbow) -->
<line x1="1010" y1="570" x2="1010" y2="630" stroke="#555" stroke-width="3"/>
<line x1="1010" y1="630" x2="950" y2="630" stroke="#555" stroke-width="3"/>
<line x1="950"  y1="630" x2="950" y2="645" stroke="#555" stroke-width="3.5" marker-end="url(#m)"/>
<line x1="1345" y1="570" x2="1345" y2="615" stroke="#555" stroke-width="3"/>
<line x1="1345" y1="615" x2="1075" y2="615" stroke="#555" stroke-width="3"/>
<line x1="1075" y1="615" x2="1075" y2="645" stroke="#555" stroke-width="3.5" marker-end="url(#m)"/>

<!-- ======== TẦNG 5: HỌC & AN TOÀN (y=850, h=150) ======== -->
<rect x="80"   y="850" width="280" height="150" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
<text x="220"  y="904" text-anchor="middle" font-size="26" fill="#1c2431">Giữ ổn định (SI)</text>
<text x="220"  y="942" text-anchor="middle" font-size="21" fill="#333">(chống quên</text>
<text x="220"  y="966" text-anchor="middle" font-size="21" fill="#333">khi học điều mới)</text>

<rect x="390"  y="850" width="280" height="150" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
<text x="530"  y="904" text-anchor="middle" font-size="26" fill="#1c2431">Kênh A — tự học</text>
<text x="530"  y="942" text-anchor="middle" font-size="21" fill="#333">(từ các lần gắp</text>
<text x="530"  y="966" text-anchor="middle" font-size="21" fill="#333">thành công)</text>

<rect x="700"  y="850" width="280" height="150" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
<text x="840"  y="904" text-anchor="middle" font-size="26" fill="#1c2431">Kênh B — thao tác mẫu</text>
<text x="840"  y="942" text-anchor="middle" font-size="21" fill="#333">(người điều khiển thử</text>
<text x="840"  y="966" text-anchor="middle" font-size="21" fill="#333">10 lần khi gặp điều lạ)</text>

<rect x="1010" y="850" width="460" height="150" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
<text x="1240" y="904" text-anchor="middle" font-size="26" fill="#1c2431">Học khi gặp trường hợp lạ</text>
<text x="1240" y="942" text-anchor="middle" font-size="21" fill="#333">(kèm giữ ổn định. Không đổi bao giờ:</text>
<text x="1240" y="966" text-anchor="middle" font-size="21" fill="#333">Mục tiêu, điều khiển cơ bản, ngưỡng lạ)</text>
</svg>
